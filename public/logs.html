<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Logs Panel — by wanz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#7c3aed;--p2:#a78bfa;--b:#06b6d4;--g:#10b981;--bg:#03050d;--card:rgba(255,255,255,.02);--border:rgba(124,58,237,.2);--muted:#475569;--dim:#334155}
body{min-height:100vh;background:var(--bg);font-family:'Inter',sans-serif;color:#f1f5f9;overflow-x:hidden}

/* BG */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(124,58,237,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.03) 1px,transparent 1px);background-size:50px 50px}
.orb{position:absolute;border-radius:50%;filter:blur(120px)}
.o1{width:500px;height:500px;background:radial-gradient(circle,rgba(124,58,237,.12),transparent 70%);top:-150px;left:-150px}
.o2{width:400px;height:400px;background:radial-gradient(circle,rgba(6,182,212,.08),transparent 70%);bottom:-100px;right:-100px}

/* LAYOUT */
.page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 20px 60px}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:36px;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;color:var(--muted);font-size:12px;font-weight:600;text-decoration:none;transition:all .2s;letter-spacing:.04em}
.back-btn:hover{border-color:rgba(124,58,237,.4);color:#a78bfa}
.back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#f1f5f9,#a78bfa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:18px 16px;text-align:center}
.stat-num{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:4px}
.stat-num.purple{background:linear-gradient(135deg,#7c3aed,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-num.cyan{background:linear-gradient(135deg,#0891b2,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-num.green{background:linear-gradient(135deg,#059669,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:7px 16px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:rgba(255,255,255,.02);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.filter-btn.active{background:rgba(124,58,237,.15);border-color:rgba(124,58,237,.4);color:#a78bfa}
.filter-btn.cyan.active{background:rgba(6,182,212,.1);border-color:rgba(6,182,212,.4);color:#06b6d4}
.search-wrap{margin-left:auto;position:relative}
.search-wrap input{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:7px 12px 7px 34px;color:#f1f5f9;font-size:12px;font-family:'Inter',sans-serif;outline:none;width:200px;transition:all .2s}
.search-wrap input:focus{border-color:rgba(124,58,237,.5);background:rgba(124,58,237,.04)}
.search-wrap input::placeholder{color:var(--dim)}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:14px;height:14px;pointer-events:none}

/* LOGS TABLE */
.logs-wrap{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:20px;overflow:hidden}
.logs-table{width:100%;border-collapse:collapse}
.logs-table th{padding:12px 16px;text-align:left;font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.01)}
.logs-table td{padding:14px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.logs-table tr:last-child td{border-bottom:none}
.logs-table tr:hover td{background:rgba(124,58,237,.04)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em}
.badge.song{background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.3);color:#a78bfa}
.badge.banner{background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.3);color:#06b6d4}
.badge svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.has-file{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#10b981;font-weight:500}
.has-file svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link-tag{color:#06b6d4;font-size:12px;word-break:break-all;text-decoration:none}
.link-tag:hover{text-decoration:underline}
.no-val{color:var(--dim);font-size:12px}
.time-col{color:var(--muted);font-size:11px;white-space:nowrap}

/* Empty state */
.empty{padding:60px 20px;text-align:center}
.empty svg{width:48px;height:48px;stroke:var(--dim);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 16px}
.empty p{color:var(--dim);font-size:14px}

/* Buttons */
.btn-clear{padding:8px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;color:#f87171;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:flex;align-items:center;gap:6px}
.btn-clear:hover{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.45)}
.btn-clear svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-refresh{padding:8px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:flex;align-items:center;gap:6px}
.btn-refresh:hover{border-color:rgba(124,58,237,.4);color:#a78bfa}
.btn-refresh svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spinning{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:999;backdrop-filter:blur(20px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.4);color:#34d399}
.toast.error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#f87171}

/* Confirm modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal{background:#0d1220;border:1px solid rgba(239,68,68,.3);border-radius:18px;padding:32px 28px;max-width:360px;width:90%;text-align:center}
.modal h3{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;margin-bottom:10px;color:#f1f5f9}
.modal p{font-size:13px;color:var(--muted);margin-bottom:24px}
.modal-btns{display:flex;gap:10px;justify-content:center}
.modal-cancel{padding:9px 20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.modal-confirm{padding:9px 20px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:9px;color:#f87171;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}

/* Pagination */
.pagination{display:flex;gap:6px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.page-btn{width:32px;height:32px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:rgba(255,255,255,.02);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:flex;align-items:center;justify-content:center}
.page-btn.active{background:rgba(124,58,237,.2);border-color:rgba(124,58,237,.5);color:#a78bfa}
.page-btn:hover:not(.active){border-color:rgba(124,58,237,.3);color:#a78bfa}

@media(max-width:640px){.stats{grid-template-columns:repeat(3,1fr)}.logs-table th:nth-child(4),.logs-table td:nth-child(4){display:none}.search-wrap input{width:140px}.topbar-title{font-size:1.2rem}}

/* ADMIN GATE */
.admin-gate{position:fixed;inset:0;z-index:80;background:rgba(3,5,13,.85);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px}
.admin-gate.hidden{display:none}
.admin-gate-box{width:100%;max-width:360px;background:rgba(255,255,255,.03);border:1px solid rgba(124,58,237,.25);border-radius:20px;padding:30px 26px;backdrop-filter:blur(40px);box-shadow:0 30px 70px rgba(0,0,0,.6)}
.admin-gate-box h2{font-family:'Space Grotesk',sans-serif;font-size:18px;color:#f1f5f9;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.admin-gate-box p{font-size:12px;color:#94a3b8;margin-bottom:18px;line-height:1.5}
.admin-gate-box input{width:100%;padding:13px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:#f1f5f9;font-size:13px;outline:none;margin-bottom:12px;font-family:'Inter',sans-serif}
.admin-gate-box input:focus{border-color:#7c3aed}
.admin-gate-err{font-size:12px;color:#ef4444;margin-bottom:10px;min-height:14px}
.admin-gate-box button{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.admin-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#a78bfa;background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.3);padding:4px 12px;border-radius:20px;margin-left:10px}
.page.locked{filter:blur(4px);pointer-events:none}
</style>
</head>
<body>
<div class="bg"><div class="bg-grid"></div><div class="orb o1"></div><div class="orb o2"></div></div>

<!-- ADMIN GATE -->
<div class="admin-gate" id="adminGate">
  <div class="admin-gate-box">
    <h2>🔒 Akses Terbatas</h2>
    <p>Halaman logs hanya bisa diakses admin utama. Masukkan Admin Key untuk masuk.</p>
    <input type="password" id="adminKeyInput" placeholder="Admin Key..." autocomplete="off"/>
    <div class="admin-gate-err" id="adminGateErr"></div>
    <button type="button" onclick="submitAdminKey()">Masuk</button>
  </div>
</div>

<div class="page locked" id="pageRoot">
  <!-- Topbar -->
  <div class="topbar">
    <a class="back-btn" href="/">
      <svg viewBox="0 0 14 14"><path d="M9 2L4 7l5 5"/></svg>
      Kembali
    </a>
    <span class="topbar-title">Logs Panel</span><span class="admin-badge" id="adminBadge" style="display:none"></span>
    <div class="topbar-actions">
      <button class="btn-refresh" id="refreshBtn" onclick="loadLogs()">
        <svg id="refreshIco" viewBox="0 0 13 13"><path d="M1 4a5.5 5.5 0 0 1 10 2M12 9a5.5 5.5 0 0 1-10-2"/><path d="M1 1v3h3"/><path d="M12 12V9H9"/></svg>
        Refresh
      </button>
      <button class="btn-clear" onclick="confirmClear()">
        <svg viewBox="0 0 13 13"><path d="M2 3h9M5 3V2h3v1M4 3v7a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V3"/></svg>
        Hapus Semua
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card"><div class="stat-num purple" id="statTotal">—</div><div class="stat-label">Total Request</div></div>
    <div class="stat-card"><div class="stat-num cyan" id="statSong">—</div><div class="stat-label">Song Request</div></div>
    <div class="stat-card"><div class="stat-num green" id="statBanner">—</div><div class="stat-label">Banner Request</div></div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all',this)">Semua</button>
    <button class="filter-btn" onclick="setFilter('song',this)">Song</button>
    <button class="filter-btn cyan" onclick="setFilter('banner',this)">Banner</button>
    <div class="search-wrap">
      <svg class="search-ico" viewBox="0 0 14 14"><circle cx="6" cy="6" r="4"/><path d="M10 10l2.5 2.5"/></svg>
      <input type="text" id="searchInput" placeholder="Cari nama / judul..." oninput="renderTable()"/>
    </div>
  </div>

  <!-- Table -->
  <div class="logs-wrap">
    <table class="logs-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Tipe</th>
          <th>Dari</th>
          <th>Detail</th>
          <th>File</th>
          <th>Waktu</th>
        </tr>
      </thead>
      <tbody id="logsBody"></tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</div>

<!-- Confirm Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Hapus Semua Logs?</h3>
    <p>Tindakan ini tidak dapat dibatalkan. Semua riwayat request akan dihapus permanen.</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Batal</button>
      <button class="modal-confirm" onclick="clearLogs()">Ya, Hapus</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PER_PAGE = 15;
let allLogs = [], filtered = [], currentFilter = 'all', currentPage = 1;

let toastT;
function showToast(msg, type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type} show`;
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3500);
}

async function loadLogs(){
  const ico=document.getElementById('refreshIco');
  ico.classList.add('spinning');
  try{
    const r=await fetch('/api/logs',{headers:{'x-admin-key':getAdminKey()}});
    if(r.status===401){ showAdminGate('Admin Key salah atau kadaluarsa.'); return; }
    allLogs=await r.json();
    document.getElementById('statTotal').textContent=allLogs.length;
    document.getElementById('statSong').textContent=allLogs.filter(l=>l.type==='song').length;
    document.getElementById('statBanner').textContent=allLogs.filter(l=>l.type==='banner').length;
    currentPage=1;
    renderTable();
  }catch{showToast('Gagal memuat logs.','error');}
  finally{setTimeout(()=>ico.classList.remove('spinning'),500);}
}

function setFilter(f,btn){
  currentFilter=f;currentPage=1;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderTable(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  filtered=allLogs.filter(l=>{
    if(currentFilter!=='all'&&l.type!==currentFilter) return false;
    if(q){
      const hay=(l.requester||'')+(l.title||'');
      if(!hay.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const total=filtered.length;
  const pages=Math.ceil(total/PER_PAGE)||1;
  if(currentPage>pages) currentPage=pages;
  const start=(currentPage-1)*PER_PAGE;
  const slice=filtered.slice(start,start+PER_PAGE);

  const tbody=document.getElementById('logsBody');
  if(!total){
    tbody.innerHTML=`<tr><td colspan="6"><div class="empty"><svg viewBox="0 0 48 48"><rect x="8" y="8" width="32" height="32" rx="4"/><path d="M16 20h16M16 28h8"/></svg><p>Belum ada logs${currentFilter!=='all'?' untuk filter ini':''}</p></div></td></tr>`;
    document.getElementById('pagination').innerHTML='';return;
  }

  tbody.innerHTML=slice.map((l,i)=>{
    const num=start+i+1;
    const badge=l.type==='song'
      ?`<span class="badge song"><svg viewBox="0 0 10 10"><path d="M5 1v5"/><circle cx="3" cy="7" r="1.5"/><path d="M5 6V3l3-.5v3"/><circle cx="6.5" cy="6.5" r="1.5"/></svg>Song</span>`
      :`<span class="badge banner"><svg viewBox="0 0 10 10"><rect x="1" y="2" width="8" height="6" rx="1"/><path d="M3 5h4M3 7h2"/></svg>Banner</span>`;
    const detail=l.type==='song'
      ?`<div style="font-weight:600;color:#f1f5f9;margin-bottom:2px">${esc(l.title||'-')}</div>${l.link?`<a class="link-tag" href="${esc(l.link)}" target="_blank">${esc(l.link.length>40?l.link.slice(0,40)+'…':l.link)}</a>`:'<span class="no-val">—</span>'}`
      :`<span class="no-val">—</span>`;
    const fileIcon=l.type==='song'
      ?(l.hasFile?`<span class="has-file"><svg viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4"/><path d="M3.5 5.5l1.5 1.5 2-2"/></svg>File</span>`:'<span class="no-val">—</span>')
      :(l.hasImage?`<span class="has-file"><svg viewBox="0 0 11 11"><rect x="1" y="2" width="9" height="7" rx="1"/><circle cx="4" cy="5" r="1"/><path d="M1 8l3-2 2 2 2-1.5 3 2"/></svg>Foto</span>`:'<span class="no-val">—</span>');
    return `<tr>
      <td style="color:var(--dim);font-size:12px">${num}</td>
      <td>${badge}</td>
      <td style="font-weight:500">${esc(l.requester||'-')}</td>
      <td>${detail}</td>
      <td>${fileIcon}</td>
      <td class="time-col">${esc(l.time||'-')}</td>
    </tr>`;
  }).join('');

  // Pagination
  const pg=document.getElementById('pagination');
  if(pages<=1){pg.innerHTML='';return;}
  let html='';
  for(let i=1;i<=pages;i++){
    html+=`<button class="page-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  pg.innerHTML=html;
}

function goPage(p){currentPage=p;renderTable();window.scrollTo({top:0,behavior:'smooth'});}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function confirmClear(){document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}

async function clearLogs(){
  closeModal();
  try{
    const r=await fetch('/api/logs',{method:'DELETE',headers:{'x-admin-key':getAdminKey()}});
    if(r.status===401){ showAdminGate('Admin Key salah atau kadaluarsa.'); return; }
    allLogs=[];filtered=[];
    document.getElementById('statTotal').textContent='0';
    document.getElementById('statSong').textContent='0';
    document.getElementById('statBanner').textContent='0';
    renderTable();
    showToast('Semua logs berhasil dihapus.');
  }catch{showToast('Gagal menghapus logs.','error');}
}

// Close modal on bg click
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

// ── ADMIN GATE ───────────────────────────────────────────────────
const ADMIN_KEY_STORE='wanz_admin_key';
const LOGIN_KEY='wanz_username';
const ADMIN_LS_KEY='wanz_adminkey';
function getAdminKey(){ return sessionStorage.getItem(ADMIN_KEY_STORE) || localStorage.getItem(ADMIN_LS_KEY) || ''; }
function setAdminKey(k){ sessionStorage.setItem(ADMIN_KEY_STORE,k); localStorage.setItem(ADMIN_LS_KEY,k); }
function showAdminGate(err){
  document.getElementById('adminGate').classList.remove('hidden');
  document.getElementById('pageRoot').classList.add('locked');
  document.getElementById('adminGateErr').textContent=err||'';
  setTimeout(()=>document.getElementById('adminKeyInput').focus(),150);
}
function hideAdminGate(identity){
  document.getElementById('adminGate').classList.add('hidden');
  document.getElementById('pageRoot').classList.remove('locked');
  if(identity){
    const badge=document.getElementById('adminBadge');
    badge.style.display='inline-flex';
    // Format: "wanz (Developer)" — proper spacing with parentheses
    const titlePart = identity.title ? ` (${identity.title})` : '';
    badge.textContent=`👑 ${identity.displayName}${titlePart}`;
    // Store username so index.html dashboard also shows correct name
    localStorage.setItem(LOGIN_KEY, identity.username || identity.displayName);
  }
}
async function submitAdminKey(){
  const input=document.getElementById('adminKeyInput');
  const key=input.value.trim();
  const errBox=document.getElementById('adminGateErr');
  if(!key){ errBox.textContent='Admin Key wajib diisi.'; return; }
  try{
    const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    const d=await r.json();
    if(!d.success){ errBox.textContent=d.message||'Admin Key salah.'; return; }
    setAdminKey(key);
    hideAdminGate(d);
    loadLogs();
    if(!window.__wanzRefreshStarted){ window.__wanzRefreshStarted=true; setInterval(loadLogs,30000); }
  }catch{ errBox.textContent='Gagal menghubungi server.'; }
}
document.getElementById('adminKeyInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submitAdminKey(); } });

(function initAdminGate(){
  const saved=getAdminKey();
  if(!saved){ showAdminGate(); return; }
  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:saved})})
    .then(r=>r.json()).then(d=>{
      if(d.success){ hideAdminGate(d); loadLogs(); if(!window.__wanzRefreshStarted){ window.__wanzRefreshStarted=true; setInterval(loadLogs,30000); } }
      else showAdminGate('Sesi admin berakhir, silakan login lagi.');
    }).catch(()=>showAdminGate());
})();
</script>
